<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motu Patlu Comedy Reel 😂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="reel">

    <div class="top">
        <h2>😂 Motu & Patlu</h2>
        <p>Comedy Conversation</p>
    </div>

    <div class="characters">
        <div class="character motu">
            <div class="emoji">🧑‍🦱</div>
            <span>Motu</span>
        </div>

        <div class="character patlu">
            <div class="emoji">👨‍🦲</div>
            <span>Patlu</span>
        </div>
    </div>

    <div class="dialogue-box">
        <div id="speaker">Motu</div>
        <div id="dialogue">
            Hii Patlu! Em chesthunav raa?
        </div>
    </div>

    <button id="playBtn">▶️ Play Reel</button>

    <div class="progress">
        <div id="progressBar"></div>
    </div>

    <div class="bottom">
        <p>❤️ 😂 🔥</p>
        <p>#MotuPatlu #Comedy #Reel</p>
    </div>

</div>

<audio id="audio" src="audio.mp3"></audio>

<script src="script.js"></script>

</body>
</html>
